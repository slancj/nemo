[project]
name = "nemo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "spirecomm",
]

[project.scripts]
nemo = "nemo.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv.sources]
spirecomm = { git = "https://github.com/ForgottenArbiter/spirecomm.git" }
